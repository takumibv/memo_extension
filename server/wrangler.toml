name = "note-everywhere-license-server"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

kv_namespaces = [
  { binding = "LICENSE_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

# シークレットは `wrangler secret put <NAME>` で登録する(このファイルには書かない):
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   LICENSE_PRIVATE_KEY_JWK  (scripts/generate-keypair.ts の出力の秘密鍵側)
